<style>
:root{--ink:#1f1f1f;--muted:#6b6b6b;--faint:#9a9a9a;--rose:#816061;--line:#ece6e6;--serif:Cormorant,Georgia,serif;--sans:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--rose);text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 40px 40px}

/* nav: the same bar as the home page and the bookshelf */
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:baseline;gap:30px;margin:10px -40px 0;padding:18px 40px 16px;font-size:15px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(1.4) blur(8px);backdrop-filter:saturate(1.4) blur(8px);transition:box-shadow .2s}
.nav.stuck{box-shadow:0 1px 0 var(--line)}
.nav a{position:relative;color:var(--muted);transition:color .2s}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;border-radius:1px;background:#bcc2cf;transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
.nav a[aria-current]{color:var(--ink)}
.nav a[aria-current]::after{transform:scaleX(1)}
.nav a:hover{color:var(--ink)}
.nav .nav-name{margin-left:auto;font:500 20px/1 var(--serif);color:var(--ink)}
.nav .nav-name::after{display:none}

/* the stage: a hairline moon orbit turning slowly around the form,
   two round cut-outs from the moodboard resting on its edge */
.stage{position:relative;display:grid;place-items:center;min-height:880px;padding:40px 0;isolation:isolate}
.ring{position:absolute;left:50%;top:50%;width:min(780px,112%);aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;overflow:visible}
.ring circle.path{fill:none;stroke:#aaa5b8;stroke-width:1;vector-effect:non-scaling-stroke}
.ring .m-dark{fill:#7a7588}
.ring .m-lit{fill:#fdfcfa}
.ring .m-edge{fill:none;stroke:#7a7588;stroke-width:1;vector-effect:non-scaling-stroke}
/* the ring turns once a minute; each moon turns back the other way so it stays upright, lit side true */
.ring .turn{transform-origin:400px 400px;animation:orbit 60s linear infinite}
.ring .moon{transform-box:fill-box;transform-origin:center;animation:orbit 60s linear infinite reverse}
@keyframes orbit{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ring .turn,.ring .moon{animation:none}}
.disc{position:absolute;z-index:1;border-radius:50%;object-fit:cover;pointer-events:none;
  box-shadow:0 14px 30px rgba(30,30,60,.22),0 2px 6px rgba(30,30,60,.1),0 0 0 4px #fff}
.disc-a{width:128px;height:128px;left:calc(50% - 311px);top:121px}
.disc-b{width:150px;height:150px;left:calc(50% + 150px);top:633px}

.panel{position:relative;width:min(470px,100%);text-align:center}
h1{font:500 64px/1 var(--serif);margin:0 0 10px;letter-spacing:-.01em}
.lede{margin:0 0 26px;color:#5f5a6b;font-size:15px}


form{display:grid;gap:10px}
.field{font:400 15px/1.5 var(--sans);color:var(--ink);width:100%;outline:none;background:#faf9fb;
  border:1px solid rgba(95,90,130,.16);border-radius:999px;padding:11px 18px;transition:border-color .2s,box-shadow .2s,background-color .2s}
textarea.field{border-radius:26px;min-height:120px;resize:vertical;padding:16px 18px}
.field:focus{background:#fff;border-color:#aab2c3;box-shadow:0 0 0 4px rgba(188,194,207,.4)}
.field::placeholder{color:#9a94a6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* the send button: the same outlined rose pill as the home page */
.button{justify-self:center;margin-top:8px;display:inline-block;padding:8px 18px;border:1px solid var(--rose);border-radius:999px;background:none;color:var(--rose);
  font:400 14px/1.5 var(--sans);white-space:nowrap;cursor:pointer;transition:background-color .2s,color .2s}
.button:hover{background:var(--rose);color:#fff}
.button:focus-visible{outline:2px solid var(--rose);outline-offset:3px}

/* elsewhere: plain rose links with the little arrow, as on the home page */
.elsewhere{display:flex;justify-content:center;gap:26px;margin:0 0 56px;font-size:15px}
.elsewhere a:hover{color:#000;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.ext::after{content:"\2197";font-size:.85em;margin-left:1px}

@media (max-width:860px){
  .wrap{padding:0 20px 40px}
  .nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:22px;margin:4px -20px 0;padding:14px 20px 12px;white-space:nowrap}
  .nav::-webkit-scrollbar{display:none}
  .nav .nav-name{display:none}
  .nav a::after{bottom:-3px}
  .stage{min-height:0;padding:150px 0 170px}
  .ring{width:172vw}
  h1{font-size:52px}
  .disc-a{width:88px;height:88px;left:-4px;top:40px}
  .disc-b{width:100px;height:100px;left:auto;top:auto;right:-4px;bottom:44px}
  .row{grid-template-columns:1fr}
}
</style>
</head>

  <section class="panel" aria-labelledby="h-connect">
    <h1 id="h-connect">connect</h1>
    <p class="lede">send me a note, a book, an idea, a little inspiration</p>
    <form id="note">
      <textarea class="field" name="msg" placeholder="write to me…" aria-label="your message" required></textarea>
      <div class="row">

</div>
<script>
(function () {
  var f = document.getElementById("note"); if (!f) return;
  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var v = function (n) { return (f.elements[n].value || "").trim(); };
    var msg = v("msg"), link = v("link"), who = v("from");
    var body = msg + (link ? "\n\n" + link : "") + (who ? "\n\n" + who : "");
    location.href = "mailto:impatriciamou@gmail.com?subject=" + encodeURIComponent("a note for you" + (who ? " from " + who : "")) +
      "&body=" + encodeURIComponent(body);
  });
})();
</script>
